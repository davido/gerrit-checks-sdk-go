name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SDK generator is the Java-based openapi-generator-cli, invoked via npx,
      # so CI needs BOTH a Node runtime and a JDK (temurin 17) in addition to Go.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      # Regen-drift gate: regenerate from the committed spec (default, self-contained --
      # no network spec fetch) and fail if the checked-in SDK or README version drifts
      # from a fresh regeneration.
      - name: Regenerate SDK (default committed spec)
        run: ./generate.sh

      - name: Fail on regeneration drift
        run: git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
